name: Build city model
# Downloads the Helsinki 3D city model (CityGML LOD2 buildings) for the game area
# and converts it into a compact binary the game loads from GitHub Pages.
on:
  push:
    paths: ['tools/**', '.github/workflows/city-model.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save earcut@2.2.4
      - run: node --max-old-space-size=6000 tools/city.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update city model data"
          git push
