name: Build multi-photo facades
# Multi-photo registered, fused Mapillary facades (CC BY-SA 4.0) for the Hanasaari-Kalasatama shoreline.
on:
  push:
    paths: [tools/facades.mjs, .github/workflows/facades.yml]
  workflow_dispatch:
concurrency:
  group: map-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save jpeg-js@0.4.4
      - run: node --max-old-space-size=6000 tools/facades.mjs
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update multi-photo facades"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done; exit 1
