name: Build waterfront photo mesh
# Converts the City of Helsinki 2024 photogrammetry mesh (CC BY 4.0) over the waterfront into data/mesh.
on:
  workflow_dispatch:   # run by hand: the result is ~60 MB
concurrency:
  group: map-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save draco3d@1.5.7 three@0.170.0 jpeg-js@0.4.4
      - run: node --max-old-space-size=6000 tools/mesh.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update waterfront photo mesh"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done; exit 1
