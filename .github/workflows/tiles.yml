name: Build textured buildings
# Converts the city's textured LOD2 building tiles (3D Tiles 1.1, Draco + KTX2) for the game area
# into plain binary meshes + JPEG textures under data/tiles/.
on:
  push:
    paths: ['tools/tiles.mjs', '.github/workflows/tiles.yml']
  workflow_dispatch:
concurrency:
  group: map-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save draco3d@1.5.7 three@0.170.0 jpeg-js@0.4.4
      - run: node --max-old-space-size=6000 tools/tiles.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update textured building tiles"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done; exit 1
